services:
  # SATARK Backend Web Service
  - type: web
    name: satark-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: EVIDENCE_STORAGE_PATH
        value: "/tmp/evidence"
      - key: DATABASE_URL
        fromDatabase:
          name: satark-postgres
          property: connectionString

databases:
  - name: satark-postgres
    plan: free
